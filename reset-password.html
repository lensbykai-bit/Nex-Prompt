<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Reset Password — Nex Prompt</title>
<meta name="theme-color" content="#080712">
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:Inter,system-ui,sans-serif;background:radial-gradient(circle at 50% 0,#2d102c 0,#0b0812 36%,#07060c 100%);color:#fff}.card{width:min(470px,94vw);padding:34px;border:1px solid #57304f;border-radius:24px;background:#100b17;box-shadow:0 30px 90px rgba(0,0,0,.5)}.brand{font-size:20px;font-weight:900;margin-bottom:26px}.brand b{color:#ff63ae}h1{font-size:31px;margin:0 0 8px}p{color:#ad9fac;line-height:1.65;font-size:13px}.field{display:block;margin:16px 0}.field span{display:block;margin-bottom:7px;color:#c5b8c3;font-size:12px}.field input{width:100%;height:50px;padding:0 14px;border:1px solid #51334d;border-radius:13px;background:#0b0810;color:#fff;outline:0;font-size:16px}.field input:focus{border-color:#ff55a5}.btn{width:100%;height:52px;border:0;border-radius:13px;background:linear-gradient(135deg,#ff2f93,#ad4cf0);color:#fff;font-size:16px;font-weight:900;cursor:pointer}.btn:disabled{opacity:.55;cursor:not-allowed}.status{display:none;margin-top:14px;padding:12px 13px;border-radius:11px;font-size:12px;line-height:1.5}.status.show{display:block}.status.error{background:#35131d;color:#ff9db5}.status.success{background:#11331f;color:#9ce9b8}.back{display:block;text-align:center;margin-top:17px;color:#ff69b3;font-size:12px;text-decoration:none;font-weight:800}.success-box{text-align:center;display:none}.success-box.show{display:block}.check{width:62px;height:62px;margin:0 auto 15px;display:grid;place-items:center;border-radius:50%;background:linear-gradient(135deg,#ff3b98,#a855f7);font-size:28px}
</style>
</head>
<body>
<div class="card">
  <div class="brand">Nex <b>Prompt</b></div>
  <div id="formPanel">
    <h1>Set new password</h1>
    <p>Choose a new password for your Nex Prompt account.</p>
    <form id="resetForm">
      <label class="field"><span>New password</span><input id="newPassword" type="password" minlength="6" autocomplete="new-password" required></label>
      <label class="field"><span>Confirm new password</span><input id="confirmPassword" type="password" minlength="6" autocomplete="new-password" required></label>
      <button class="btn" id="resetBtn" type="submit">Update password</button>
    </form>
    <div class="status" id="status"></div>
  </div>
  <div class="success-box" id="successPanel">
    <div class="check">✓</div>
    <h1>Password updated</h1>
    <p>Your password has been changed. You can now sign in to Nex Prompt.</p>
    <a class="back" href="/">Return to Nex Prompt →</a>
  </div>
  <a class="back" id="homeLink" href="/">← Back to Nex Prompt</a>
</div>
<script>
(function(){
'use strict';
var API='https://kbanmyaqodtfoqikzwou.supabase.co/functions/v1/password-reset';
var hash=new URLSearchParams(location.hash.replace(/^#/,''));
var token=hash.get('access_token')||'';
var status=document.getElementById('status');
function show(msg,type){status.textContent=msg;status.className='status show '+(type||'error')}
if(!token){show('This password reset link is missing or expired. Request a new reset link from the Sign in window.');document.getElementById('resetBtn').disabled=true}
document.getElementById('resetForm').addEventListener('submit',function(e){
 e.preventDefault();
 var p=document.getElementById('newPassword').value;
 var c=document.getElementById('confirmPassword').value;
 if(p.length<6)return show('Password must be at least 6 characters.');
 if(p!==c)return show('Passwords do not match.');
 var btn=document.getElementById('resetBtn');btn.disabled=true;btn.textContent='Updating...';show('Updating your password...','success');
 fetch(API+'?action=complete',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({access_token:token,password:p})})
 .then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.error||'Could not update password.');return d})})
 .then(function(){document.getElementById('formPanel').style.display='none';document.getElementById('homeLink').style.display='none';document.getElementById('successPanel').classList.add('show');history.replaceState(null,'',location.pathname)})
 .catch(function(err){show(err.message||'Could not update password.');btn.disabled=false;btn.textContent='Update password'});
});
})();
</script>
</body>
</html>
