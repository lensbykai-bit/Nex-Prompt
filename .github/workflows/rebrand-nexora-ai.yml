name: NEXORA Ai purchase maintenance

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-nexora-ai.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Keep login session refresh working
        run: python3 .github/scripts/patch_session.py

      - name: Apply seven-day purchase access UI
        run: python3 .github/scripts/patch_purchase_expiry.py

      - name: Commit NEXORA Ai frontend updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js forgot-password.js
          if git diff --cached --quiet; then
            echo "No frontend changes needed."
            exit 0
          fi
          git commit -m "Clean checkout and session helpers"
          git push
