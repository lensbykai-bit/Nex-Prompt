name: Rebrand to NEXORA Ai

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-nexora-ai.yml'

permissions:
  contents: write

jobs:
  rebrand:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update NEXORA Ai visible text
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = []
          for pattern in ('*.html', '*.css', '*.js'):
              files.extend(Path('.').glob(pattern))

          replacements = [
              ('%C2%A9 Nex Prompt %E2%80%A2 Rafy Bo', '%C2%A9%20NEXORA%20Ai'),
              ('%C2%A9 NEXORA-Ai', '%C2%A9%20NEXORA%20Ai'),
              ('%C2%A9 NEXORA-AI', '%C2%A9%20NEXORA%20Ai'),
              ('Nex <b>Prompt</b>', 'NEXORA <b>Ai</b>'),
              ('Nex <strong>Prompt</strong>', 'NEXORA <strong>Ai</strong>'),
              ('© Nex Prompt • Rafy Bo', '© NEXORA Ai'),
              ('© Nex Prompt', '© NEXORA Ai'),
              ('© NEXORA-Ai', '© NEXORA Ai'),
              ('© NEXORA-AI', '© NEXORA Ai'),
              ('NEXORA-AI', 'NEXORA Ai'),
              ('NEXORA-Ai', 'NEXORA Ai'),
              ('Nexora Ai', 'NEXORA Ai'),
              ('Nex Prompt', 'NEXORA Ai'),
              ('NEXORA Ai AI Tools', 'NEXORA Ai Tools'),
              ('content="Prompt marketplace, AI tools and shared credits for creators."', 'content="NEXORA Ai prompt marketplace, AI tools and shared credits for creators."'),
          ]

          changed = []
          for path in sorted(set(files)):
              text = path.read_text(encoding='utf-8')
              new = text
              for old, replacement in replacements:
                  new = new.replace(old, replacement)

              if path.name == 'forgot-password.js':
                  thank_replacements = [
                      ('PAYMENT SUCCESSFUL', 'ការទូទាត់ជោគជ័យ'),
                      ('Thank you for using NEXORA Ai', 'អរគុណសម្រាប់ការប្រើប្រាស់ NEXORA Ai'),
                      ('Your payment was completed successfully. Your purchased Prompt is now saved in My Prompts.', 'ការទូទាត់របស់អ្នកបានជោគជ័យ។ Prompt ដែលអ្នកបានទិញត្រូវបានរក្សាទុកក្នុង Prompt របស់ខ្ញុំ រួចហើយ។'),
                      ('Your payment was completed successfully.', 'ការទូទាត់របស់អ្នកបានជោគជ័យ។ Prompt ដែលអ្នកបានទិញត្រូវបានរក្សាទុកក្នុង Prompt របស់ខ្ញុំ រួចហើយ។'),
                      ('>Continue</button>', '>បន្ត</button>'),
                      ("btn.textContent='Continue'", "btn.textContent='បន្ត'"),
                      ("title.textContent='អរគុណសម្រាប់ការប្រើប្រាស់';", "title.textContent='អរគុណសម្រាប់ការប្រើប្រាស់ NEXORA Ai';"),
                      ("text.textContent='ការទូទាត់របស់អ្នកបានបញ្ចប់ដោយជោគជ័យ។ Prompt ដែលអ្នកបានទិញត្រូវបានរក្សាទុកក្នុង My Prompts។';", "text.textContent='ការទូទាត់របស់អ្នកបានជោគជ័យ។ Prompt ដែលអ្នកបានទិញត្រូវបានរក្សាទុកក្នុង Prompt របស់ខ្ញុំ រួចហើយ។';"),
                  ]
                  for old, replacement in thank_replacements:
                      new = new.replace(old, replacement)

              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Changed files:')
          for p in changed:
              print(' -', p)
          PY

      - name: Commit updates
        run: |
          if git diff --quiet; then
            echo "No visible text changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' '*.css' '*.js'
          git commit -m "Polish Khmer payment success popup"
          git push
