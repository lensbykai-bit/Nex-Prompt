name: Rebrand to NEXORA Ai

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/rebrand-nexora-ai.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply session refresh repair
        run: python3 .github/scripts/patch_session.py

      - name: Commit repaired frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js forgot-password.js
          if git diff --cached --quiet; then
            echo "No repair changes needed."
            exit 0
          fi
          git commit -m "Fix expired login session checkout"
          git push
