name: Make NEXORA Ai Chat Free
on:
  push:
    paths:
      - '.github/workflows/free-ai-chat.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Update AI Chat labels
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('Sign in once, then use the same account and shared credits across supported tools.','Sign in once. AI Chat is FREE; other supported tools use your shared Credits.')
          s=s.replace('<span class="cost">1–3 credits/request</span>','<span class="cost">FREE</span>')
          s=s.replace('ai-chat-ui.js?v=20260826-1','ai-chat-ui.js?v=20260826-2')
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if ! git diff --cached --quiet; then
            git commit -m "Show AI Chat as free"
            git push
          fi
