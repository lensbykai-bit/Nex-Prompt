name: Add NEXORA Ai Pay Now
on:
  push:
    paths:
      - '.github/workflows/add-buy-now.yml'
      - '.github/scripts/patch_buy_now.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Apply Pay Now patch
        run: python .github/scripts/patch_buy_now.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html app.css app.js forgot-password.js
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add direct Pay Now for Prompt purchases"
            git push
          fi
