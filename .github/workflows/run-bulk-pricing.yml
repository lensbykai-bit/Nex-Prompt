name: Run bulk pricing patch

on:
  push:
    paths:
      - '.github/bulk-price-trigger.txt'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Admin bulk pricing
        run: python .github/scripts/add_bulk_pricing.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin-price.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Add Select All bulk prompt pricing"
            git push
          fi
