<!DOCTYPE html>
<html lang="km">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#080712">
<title>Nex Prompt — Prompt Manager</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,"Noto Sans Khmer",system-ui,sans-serif;background:#080712;color:#f8f3f8;min-height:100vh}button,input,select,textarea{font:inherit}button{cursor:pointer}.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:14px;padding:16px 24px;background:#090713f5;border-bottom:1px solid #2d1b31}.brand{font-size:22px;font-weight:900}.brand b{color:#ff69b3}.top-label{color:#9e93a1;font-size:12px}.back{margin-left:auto;color:#ff79bc;text-decoration:none;border:1px solid #56304e;border-radius:12px;padding:10px 14px}.wrap{max-width:1240px;margin:0 auto;padding:38px 22px 70px}.eyebrow{color:#ff69b3;font-size:11px;font-weight:900;letter-spacing:.08em}.head{display:flex;align-items:end;gap:18px;justify-content:space-between;margin:10px 0 24px}.head h1{font-size:38px;margin:8px 0}.head p{margin:0;color:#aa9fac}.head-actions{display:flex;gap:10px;align-items:center}.search{width:300px;height:46px;border:1px solid #3f2942;border-radius:13px;background:#100c18;color:#fff;padding:0 14px;outline:none}.add{height:46px;border:0;border-radius:13px;padding:0 18px;background:linear-gradient(135deg,#ff2d91,#a855f7);color:#fff;font-weight:900;white-space:nowrap}.notice{display:none;padding:13px 15px;border-radius:13px;margin-bottom:18px;font-size:13px;line-height:1.6}.notice.show{display:block}.notice.ok{background:#10291a;color:#9be5b8;border:1px solid #27593a}.notice.err{background:#35131e;color:#ff9db8;border:1px solid #67283c}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:22px}.stat{padding:15px 17px;border:1px solid #342138;border-radius:16px;background:#100c18}.stat b{display:block;font-size:22px}.stat span{color:#9f94a2;font-size:11px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}.card{overflow:hidden;border:1px solid #342138;border-radius:18px;background:linear-gradient(145deg,#110d19,#17101f)}.img{height:170px;background:#18121f center/cover no-repeat;position:relative}.state{position:absolute;top:10px;right:10px;padding:5px 8px;border-radius:999px;font-size:9px;font-weight:900;background:#13351f;color:#a9e8bd;border:1px solid #2b6c43}.state.off{background:#35131e;color:#ff9db8;border-color:#67283c}.body{padding:16px}.title{font-size:16px;font-weight:850;margin-bottom:6px}.meta{color:#9f94a2;font-size:11px;min-height:18px}.desc{color:#b2a7b5;font-size:11px;line-height:1.55;margin-top:8px;min-height:34px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.price-row{display:flex;align-items:end;gap:9px;margin-top:14px}.price-field{flex:1}.price-field span{display:block;color:#a99eac;font-size:10px;margin-bottom:5px}.price-wrap{position:relative}.price-wrap i{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-style:normal;color:#ff69b3;font-weight:900}.price-wrap input{width:100%;height:44px;border:1px solid #56304e;border-radius:12px;background:#09070e;color:#fff;padding:0 12px 0 29px;outline:none;font-weight:850}.save,.mini{height:44px;padding:0 16px;border:0;border-radius:12px;background:linear-gradient(135deg,#ff2d91,#a855f7);color:#fff;font-weight:900}.save:disabled,.mini:disabled{opacity:.55;cursor:not-allowed}.badge{display:inline-flex;margin-top:9px;padding:5px 8px;border:1px solid #633052;border-radius:999px;color:#ff80bd;font-size:9px}.card-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.mini{height:38px;font-size:11px}.mini.secondary{background:#17101d;border:1px solid #56304e;color:#f2dce9}.empty{grid-column:1/-1;text-align:center;padding:50px 20px;border:1px dashed #443047;border-radius:18px;color:#9d92a0}.login-box{max-width:520px;margin:60px auto;padding:28px;border:1px solid #4b2948;border-radius:20px;background:#100c18;text-align:center}.login-box h2{margin-top:0}.login-box p{color:#aaa0ac;line-height:1.7}.login-box a{display:inline-flex;margin-top:8px;padding:12px 18px;border-radius:12px;background:linear-gradient(135deg,#ff2d91,#a855f7);color:#fff;text-decoration:none;font-weight:900}
.modal{border:0;padding:0;background:transparent;max-width:none}.modal::backdrop{background:rgba(5,3,10,.78);backdrop-filter:blur(7px)}.modal-card{width:min(94vw,900px);max-height:92vh;overflow:auto;border:1px solid #57304f;border-radius:24px;background:#0f0a16;color:#fff;padding:25px;box-shadow:0 30px 90px #0009}.modal-head{display:flex;align-items:center;gap:12px;margin-bottom:18px}.modal-head h2{margin:0;font-size:25px}.close{margin-left:auto;width:42px;height:42px;border-radius:50%;border:1px solid #57304f;background:#17101d;color:#fff;font-size:24px}.form-grid{display:grid;grid-template-columns:1fr 1.25fr;gap:20px}.upload-box{min-height:310px;border:1px dashed #714062;border-radius:18px;background:#0b0810;display:flex;flex-direction:column;overflow:hidden}.preview{height:230px;background:#15101a center/cover no-repeat;display:grid;place-items:center;color:#817784;font-size:12px}.upload-actions{padding:13px}.upload-label{display:flex;align-items:center;justify-content:center;height:44px;border-radius:12px;background:#201321;color:#ff76ba;font-weight:850;cursor:pointer}.upload-label input{display:none}.upload-note{margin:8px 0 0;color:#867d89;font-size:10px;text-align:center}.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:block}.field.full{grid-column:1/-1}.field span{display:block;color:#b5aab7;font-size:10px;margin-bottom:6px}.field input,.field select,.field textarea{width:100%;border:1px solid #4b2b48;border-radius:12px;background:#09070e;color:#fff;padding:11px 12px;outline:none}.field input,.field select{height:44px}.field textarea{min-height:90px;resize:vertical;line-height:1.55}.field textarea.prompt-text{min-height:180px}.switch{grid-column:1/-1;display:flex;align-items:center;gap:9px;color:#c0b5c2;font-size:12px}.switch input{width:17px;height:17px;accent-color:#ff3e9d}.form-actions{display:flex;gap:10px;justify-content:flex-end;margin-top:20px}.form-actions button{height:48px;padding:0 20px;border-radius:13px;font-weight:900}.cancel{border:1px solid #57304f;background:#17101d;color:#fff}.submit{border:0;background:linear-gradient(135deg,#ff2d91,#a855f7);color:#fff}.submit:disabled{opacity:.55}.form-status{display:none;margin-top:13px;padding:12px;border-radius:11px;font-size:11px}.form-status.show{display:block}.form-status.err{background:#35131e;color:#ff9db8}.form-status.ok{background:#10291a;color:#9be5b8}
@media(max-width:950px){.grid{grid-template-columns:repeat(2,1fr)}.head{align-items:flex-start}.head-actions{flex-direction:column;align-items:stretch}.search{width:280px}.form-grid{grid-template-columns:1fr}.upload-box{min-height:auto}.preview{height:260px}}@media(max-width:620px){.grid,.stats{grid-template-columns:1fr}.wrap{padding:28px 14px 55px}.top{padding:13px 15px}.top-label{display:none}.head{display:block}.head h1{font-size:30px}.head-actions{margin-top:16px}.search{width:100%}.add{width:100%}.fields{grid-template-columns:1fr}.field.full,.switch{grid-column:1}.modal-card{padding:18px}.form-actions{display:grid;grid-template-columns:1fr 1fr}.form-actions button{width:100%}}
</style>
</head>
<body>
<header class="top"><div class="brand">Nex <b>Prompt</b></div><span class="top-label">Admin · Prompt Manager</span><a class="back" href="/">← ទៅ Nex Prompt</a></header>
<main class="wrap">
<div class="eyebrow">PROMPT ADMIN</div>
<div class="head"><div><h1>គ្រប់គ្រង Prompt</h1><p>Upload រូប, ដាក់ Full Prompt, កែតម្លៃ និងបង្ហោះទៅ Marketplace ដោយផ្ទាល់។</p></div><div class="head-actions"><input class="search" id="search" type="search" placeholder="ស្វែងរក Prompt..."><button class="add" id="addPromptBtn" type="button">+ បន្ថែម Prompt ថ្មី</button></div></div>
<div class="notice" id="notice"></div>
<div class="stats" id="stats"><div class="stat"><b>—</b><span>Prompt សរុប</span></div><div class="stat"><b>—</b><span>កំពុងបង្ហាញ</span></div><div class="stat"><b>—</b><span>បានលាក់</span></div></div>
<div id="content"><div class="empty">កំពុងទាញ Prompt...</div></div>
</main>

<dialog class="modal" id="promptEditor">
<div class="modal-card">
<div class="modal-head"><div><div class="eyebrow" id="editorEyebrow">ADD PROMPT</div><h2 id="editorTitle">បន្ថែម Prompt ថ្មី</h2></div><button class="close" id="editorClose" type="button">×</button></div>
<form id="promptForm">
<div class="form-grid">
<div class="upload-box"><div class="preview" id="imagePreview">មិនទាន់មានរូប</div><div class="upload-actions"><label class="upload-label">📷 ជ្រើសរើសរូប<input id="imageFile" type="file" accept="image/jpeg,image/png,image/webp,image/gif"></label><p class="upload-note">JPG / PNG / WEBP / GIF · អតិបរមា 5MB</p></div></div>
<div class="fields">
<label class="field full"><span>ចំណងជើង / Prompt Title</span><input id="fTitle" required maxlength="180" placeholder="ឧ. Cinematic Mountain Reveal"></label>
<label class="field"><span>Category</span><select id="fCategory"><option value="cinematic">Cinematic</option><option value="nature">Nature</option><option value="sci-fi">Sci-Fi</option><option value="fantasy">Fantasy</option><option value="product">Product Ads</option></select></label>
<label class="field"><span>តម្លៃ / Price (USD)</span><input id="fPrice" type="number" min="0.01" max="9999" step="0.01" value="0.01" required></label>
<label class="field"><span>Creator</span><input id="fCreator" maxlength="100" value="Nex Prompt"></label>
<label class="field"><span>Model</span><input id="fModel" maxlength="120" placeholder="Kling / Veo / Runway / Sora"></label>
<label class="field full"><span>Short Description</span><textarea id="fDescription" maxlength="1200" placeholder="សរសេរពិពណ៌នាខ្លីអំពី Prompt នេះ..."></textarea></label>
<label class="field full"><span>Full Prompt — អតិថិជនឃើញក្រោយទិញ</span><textarea class="prompt-text" id="fPrompt" maxlength="20000" required placeholder="ដាក់ Prompt ពេញនៅទីនេះ..."></textarea></label>
<label class="switch"><input id="fPublished" type="checkbox" checked> បង្ហាញ Prompt នេះនៅ Marketplace ភ្លាមៗ</label>
</div>
</div>
<div class="form-status" id="formStatus"></div>
<div class="form-actions"><button class="cancel" id="editorCancel" type="button">បោះបង់</button><button class="submit" id="savePromptBtn" type="submit">Save Prompt</button></div>
</form>
</div>
</dialog>

<script>
(function(){
'use strict';
var API='https://kbanmyaqodtfoqikzwou.supabase.co/functions/v1/admin-prompts';
var STORE='https://kbanmyaqodtfoqikzwou.supabase.co/functions/v1/store-api';
var session=null,items=[],editingId=null,currentImageUrl='',pendingFile=null;
function $(s){return document.querySelector(s)}
function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function getSession(){try{return JSON.parse(localStorage.getItem('nex_cloud_session')||'null')}catch(e){return null}}
function notice(msg,type){var n=$('#notice');n.textContent=msg;n.className='notice show '+(type||'ok');clearTimeout(window.__notice);window.__notice=setTimeout(function(){n.className='notice'},3600)}
function formStatus(msg,type){var n=$('#formStatus');n.textContent=msg||'';n.className='form-status'+(msg?' show '+(type||'err'):'')}
function req(action,opt){opt=opt||{};return fetch(API+'?action='+encodeURIComponent(action),{method:opt.method||'GET',headers:{'Content-Type':'application/json','Authorization':'Bearer '+session.access_token},body:opt.body?JSON.stringify(opt.body):undefined}).then(function(r){return r.json().catch(function(){return{}}).then(function(d){if(!r.ok)throw new Error(d.error||'Request failed');return d})})}
function updateStats(){var on=items.filter(function(x){return x.is_published}).length;var boxes=$$('#stats .stat b');if(boxes[0])boxes[0].textContent=items.length;if(boxes[1])boxes[1].textContent=on;if(boxes[2])boxes[2].textContent=items.length-on}
function $$(s){return Array.prototype.slice.call(document.querySelectorAll(s))}
function render(){var q=($('#search').value||'').trim().toLowerCase();var list=items.filter(function(p){return !q||(String(p.title||'')+' '+String(p.category||'')+' '+String(p.creator||'')).toLowerCase().indexOf(q)>=0});var root=$('#content');updateStats();if(!list.length){root.innerHTML='<div class="empty">រកមិនឃើញ Prompt ទេ។</div>';return}root.innerHTML='<div class="grid">'+list.map(function(p){return '<article class="card" data-id="'+esc(p.id)+'"><div class="img" style="background-image:url(&quot;'+esc(p.image_url||'')+'&quot;)"><span class="state '+(p.is_published?'':'off')+'">'+(p.is_published?'VISIBLE':'HIDDEN')+'</span></div><div class="body"><div class="title">'+esc(p.title)+'</div><div class="meta">'+esc(p.category||'')+' · '+esc(p.creator||'Nex Prompt')+'</div><div class="desc">'+esc(p.description||'មិនទាន់មាន Description')+'</div><span class="badge">ID '+esc(p.id)+'</span><div class="price-row"><label class="price-field"><span>តម្លៃ / Price (USD)</span><div class="price-wrap"><i>$</i><input type="number" min="0.01" max="9999" step="0.01" value="'+Number(p.price||0).toFixed(2)+'" data-price></div></label><button class="save" type="button" data-save>Save</button></div><div class="card-actions"><button class="mini secondary" type="button" data-edit>✎ Edit Prompt</button><button class="mini secondary" type="button" data-publish>'+(p.is_published?'Hide':'Show')+'</button></div></div></article>'}).join('')+'</div>'}
function load(){req('list').then(function(d){items=d.items||[];render()}).catch(function(e){if(/admin access/i.test(e.message))showLogin('គណនីនេះមិនមែន Admin ទេ។');else showLogin(e.message)})}
function showLogin(msg){$('#stats').style.display='none';$('#content').innerHTML='<div class="login-box"><h2>ត្រូវចូលគណនី Admin</h2><p>'+esc(msg||'សូមចូលគណនី Admin នៅ Nex Prompt ជាមុន។')+'</p><a href="/">ចូលគណនី Nex Prompt</a></div>'}
function openEditor(item){editingId=item?Number(item.id):null;currentImageUrl=item&&item.image_url?item.image_url:'';pendingFile=null;$('#imageFile').value='';$('#editorEyebrow').textContent=item?'EDIT PROMPT':'ADD PROMPT';$('#editorTitle').textContent=item?'កែ Prompt':'បន្ថែម Prompt ថ្មី';$('#fTitle').value=item?item.title||'':'';$('#fCategory').value=item?item.category||'cinematic':'cinematic';$('#fPrice').value=item?Number(item.price||.01).toFixed(2):'0.01';$('#fCreator').value=item?item.creator||'Nex Prompt':'Nex Prompt';$('#fModel').value=item?item.model||'':'';$('#fDescription').value=item?item.description||'':'';$('#fPrompt').value=item?item.prompt_text||'':'';$('#fPublished').checked=item?!!item.is_published:true;renderPreview();formStatus('');var d=$('#promptEditor');try{if(!d.open)d.showModal()}catch(e){d.setAttribute('open','')}}
function closeEditor(){var d=$('#promptEditor');try{if(d.open)d.close()}catch(e){d.removeAttribute('open')}}
function renderPreview(){var p=$('#imagePreview');if(pendingFile&&pendingFile.preview){p.style.backgroundImage='url("'+pendingFile.preview.replace(/"/g,'')+'")';p.textContent=''}else if(currentImageUrl){p.style.backgroundImage='url("'+currentImageUrl.replace(/"/g,'')+'")';p.textContent=''}else{p.style.backgroundImage='';p.textContent='មិនទាន់មានរូប'}}
function fileData(file){return new Promise(function(resolve,reject){if(!file)return resolve(null);if(file.size>5*1024*1024)return reject(new Error('រូបភាពត្រូវតែតូចជាង 5MB។'));var r=new FileReader();r.onload=function(){resolve({mime:file.type||'image/jpeg',data_base64:String(r.result||'')})};r.onerror=function(){reject(new Error('មិនអាចអានរូបភាពបានទេ។'))};r.readAsDataURL(file)})}
function uploadIfNeeded(){if(!pendingFile)return Promise.resolve(currentImageUrl);return fileData(pendingFile.file).then(function(fd){formStatus('កំពុង Upload រូបភាព...','ok');return req('upload',{method:'POST',body:fd})}).then(function(d){currentImageUrl=d.url;return currentImageUrl})}
function collectBody(){return{title:$('#fTitle').value.trim(),category:$('#fCategory').value,price:Number($('#fPrice').value),creator:$('#fCreator').value.trim(),model:$('#fModel').value.trim(),description:$('#fDescription').value.trim(),prompt_text:$('#fPrompt').value.trim(),image_url:currentImageUrl,is_published:$('#fPublished').checked}}
function savePrompt(e){e.preventDefault();var btn=$('#savePromptBtn');var body=collectBody();if(!body.title)return formStatus('សូមដាក់ចំណងជើង Prompt។','err');if(!isFinite(body.price)||body.price<.01)return formStatus('តម្លៃអប្បបរមាគឺ $0.01។','err');if(!body.prompt_text)return formStatus('សូមដាក់ Full Prompt។','err');if(!currentImageUrl&&!pendingFile)return formStatus('សូម Upload រូប Prompt។','err');btn.disabled=true;btn.textContent='Saving...';uploadIfNeeded().then(function(){body=collectBody();if(editingId){body.id=editingId;return req('update',{method:'POST',body:body})}return req('create',{method:'POST',body:body})}).then(function(d){var idx=items.findIndex(function(x){return Number(x.id)===Number(d.item.id)});if(idx>=0)items[idx]=d.item;else items.unshift(d.item);render();closeEditor();notice(editingId?'បានកែ Prompt ជោគជ័យ ✓':'បានបន្ថែម Prompt ថ្មីជោគជ័យ ✓','ok')}).catch(function(err){formStatus(err.message||'មិនអាច Save Prompt បានទេ។','err')}).finally(function(){btn.disabled=false;btn.textContent='Save Prompt'})}

document.addEventListener('click',function(e){var card=e.target.closest('[data-id]');var id=card?Number(card.getAttribute('data-id')):null;if(e.target.closest('[data-save]')){var b=e.target.closest('[data-save]'),input=card.querySelector('[data-price]'),price=Number(input.value);if(!isFinite(price)||price<0.01){notice('តម្លៃអប្បបរមាគឺ $0.01។','err');return}b.disabled=true;b.textContent='Saving...';req('price',{method:'POST',body:{id:id,price:price}}).then(function(d){var found=items.find(function(x){return Number(x.id)===id});if(found)found.price=d.item.price;input.value=Number(d.item.price).toFixed(2);notice('បានកែតម្លៃ Prompt ជោគជ័យ ✓','ok')}).catch(function(err){notice(err.message,'err')}).finally(function(){b.disabled=false;b.textContent='Save'});return}if(e.target.closest('[data-edit]')){openEditor(items.find(function(x){return Number(x.id)===id}));return}if(e.target.closest('[data-publish]')){var item=items.find(function(x){return Number(x.id)===id});if(!item)return;var b2=e.target.closest('[data-publish]');b2.disabled=true;req('publish',{method:'POST',body:{id:id,is_published:!item.is_published}}).then(function(d){item.is_published=d.item.is_published;render();notice(item.is_published?'Prompt បានបង្ហាញនៅ Marketplace ✓':'Prompt ត្រូវបានលាក់ ✓','ok')}).catch(function(err){notice(err.message,'err')}).finally(function(){b2.disabled=false});return}});
$('#addPromptBtn').addEventListener('click',function(){openEditor(null)});$('#editorClose').addEventListener('click',closeEditor);$('#editorCancel').addEventListener('click',closeEditor);$('#promptForm').addEventListener('submit',savePrompt);$('#search').addEventListener('input',render);$('#imageFile').addEventListener('change',function(){var f=this.files&&this.files[0];if(!f)return;if(!/^image\/(jpeg|png|webp|gif)$/.test(f.type)){formStatus('សូមជ្រើសរើស JPG, PNG, WEBP ឬ GIF។','err');this.value='';return}if(f.size>5*1024*1024){formStatus('រូបភាពត្រូវតែតូចជាង 5MB។','err');this.value='';return}var r=new FileReader();r.onload=function(){pendingFile={file:f,preview:String(r.result||'')};renderPreview()};r.readAsDataURL(f)});

session=getSession();if(!session||!session.access_token)showLogin('សូម Sign in ជាមួយគណនី Admin មុន។');else fetch(STORE+'?action=me',{headers:{Authorization:'Bearer '+session.access_token}}).then(function(r){return r.json()}).then(function(d){if(d.profile&&d.profile.role==='admin')load();else showLogin('គណនីនេះមិនមានសិទ្ធិ Admin ទេ។')}).catch(function(){showLogin('Session ផុតកំណត់។ សូម Sign in ម្តងទៀត។')});
})();
</script>
</body>
</html>
