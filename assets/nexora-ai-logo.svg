<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" role="img" aria-labelledby="title desc">
<title id="title">NEXORA Ai</title>
<desc id="desc">Clean premium NEXORA Ai logo for a dark pink-purple theme</desc>
<defs>
  <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#7fd7ff"/>
    <stop offset=".42" stop-color="#9b5cff"/>
    <stop offset="1" stop-color="#ff4ba8"/>
  </linearGradient>
  <linearGradient id="nfill" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".55" stop-color="#ececff"/>
    <stop offset="1" stop-color="#ffb9df"/>
  </linearGradient>
  <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#ffffff"/>
    <stop offset=".76" stop-color="#f5f1ff"/>
    <stop offset="1" stop-color="#ddd7ff"/>
  </linearGradient>
  <linearGradient id="ai" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#ff7bc0"/>
    <stop offset=".55" stop-color="#ff42a1"/>
    <stop offset="1" stop-color="#c95cff"/>
  </linearGradient>
  <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="tinyGlow" x="-40%" y="-40%" width="180%" height="180%">
    <feGaussianBlur stdDeviation="2.4" result="b"/>
    <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<!-- icon -->
<g transform="translate(10 8)">
  <circle cx="82" cy="87" r="69" fill="#090812" stroke="#24172e" stroke-width="10"/>
  <circle cx="82" cy="87" r="67" fill="none" stroke="url(#ring)" stroke-width="3.2" filter="url(#tinyGlow)"/>
  <circle cx="82" cy="87" r="57" fill="none" stroke="#2b1631" stroke-width="1.5" opacity=".9"/>
  <path d="M48 133V42h21l48 56V42h25v91h-22L73 79v54z" fill="url(#nfill)"/>
  <path d="M25 124C62 96 111 75 151 64" fill="none" stroke="#ff4aa8" stroke-width="4.7" stroke-linecap="round" filter="url(#softGlow)"/>
  <path d="M29 128C72 109 119 88 158 60" fill="none" stroke="#9a65ff" stroke-width="2" stroke-linecap="round" opacity=".75"/>
  <circle cx="151" cy="64" r="3.2" fill="#ff82c6" filter="url(#tinyGlow)"/>
</g>

<!-- wordmark -->
<g transform="translate(182 0)">
  <text x="0" y="118" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="82" font-weight="900" letter-spacing="2.5" fill="url(#word)">NEXORA</text>
  <text x="432" y="120" font-family="Segoe Script,Brush Script MT,cursive" font-size="78" font-style="italic" font-weight="700" fill="url(#ai)" filter="url(#tinyGlow)">Ai</text>
  <rect x="1" y="143" width="356" height="3" rx="1.5" fill="url(#ring)" opacity=".9"/>
  <circle cx="373" cy="144.5" r="3.2" fill="#ff4aa8"/>
  <text x="1" y="170" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing="5.2" fill="#9e92aa">PREMIUM PROMPT MARKETPLACE</text>
</g>
</svg>